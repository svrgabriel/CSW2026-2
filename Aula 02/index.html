<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon-32x32.png" type="image/x-icon">
    <title>Aula Imagem</title>
    
</head>
<body>
    <h1>Desafio das Imagens</h1>
    <h2>Vitória, Espírito Santo</h2>
    <br>
    <hr>
    <br>
    <!-- Foto 1 -->
    <center><img src="foto1.jpg" alt="Alguma praia de Vitória" width="600"></center><br><hr>

    <!-- Foto 2 -->
    <br><center><figure>
        <img src="foto2.jpg" alt="Bar do Mãozinha" width="600">
        <center><figcaption>Bar do Mãozinha (já fui muito)</figcaption>
    </figure></center><br><hr>

    <!-- Foto 3 -->
    <br><center><picture>

        <source source media="(max-width: 767px)"
            srcset="foto3.jpg" type="image/jpg" source media="(min-width: 768px)">

        <source srcset="foto3.jpg" type="image/jpg">
        <img src="foto3.jpg" alt="Praia de Camburi" width="100%">

    </picture></center><br><hr>

    <!-- Foto 4 -->
    <picture>
        <source media="(max-width: 500px)"
            srcset="foto4.jpg" type="image/jpg">
        <source media="(min-width: 501px)"
            srcset="foto5.jpg" type="image/jpg">
        <img src="foto5.jpg" alt="asdasd" width="100%">
    
</body>
</html>
